[project]
name = "knowledgegraphs"
version = "1.0.0"
description = "Knowledge Graph & Graph RAG: From Concepts to Production"
readme = "README.md"
requires-python = ">=3.11"

# Core deps — these install with `uv sync`
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "openai>=1.40.0",
    "neo4j>=5.15",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pyvis>=0.3.2",
    "chromadb>=0.4.0",
    "pandas>=2.1",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
# Extra groups — install with: uv sync --extra <name>
graph-rag = [
    "langgraph>=0.2.0",
    "tavily-python>=0.4.0",
]
rdf = [
    "rdflib>=7.0.0",
    "SPARQLWrapper>=2.0.0",
]
biomedical = [
    "biopython>=1.83",
]
streaming = [
    "websockets>=12.0",
    "watchfiles>=0.21.0",
]
explorer = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
ollama = [
    "langchain-ollama>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projects/shared"]
